<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для моей любимой 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink-soft: #fde4ec;
    --pink-medium: #f8c8d8;
    --peach: #fde2d3;
    --lavender: #e8dff5;
    --cream: #fff8f3;
    --rose: #d4a5b5;
    --text-dark: #5a4a52;
    --text-light: #8a7a82;
  }
  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, var(--cream) 0%, var(--pink-soft) 50%, var(--lavender) 100%);
    min-height: 100vh;
    color: var(--text-dark);
    overflow-x: hidden;
    position: relative;
  }
  .hearts-bg {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .heart {
    position: absolute; font-size: 20px; opacity: 0.3;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 0.3; } 90% { opacity: 0.3; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }
  .container {
    max-width: 1200px; margin: 0 auto;
    padding: 40px 20px; position: relative; z-index: 1;
  }
  header {
    text-align: center; margin-bottom: 50px;
    padding: 40px 20px;
    background: rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 8px 32px rgba(212, 165, 181, 0.15);
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 400; color: var(--text-dark);
    margin-bottom: 15px; letter-spacing: 1px;
  }
  .subtitle {
    font-size: 1.1rem; color: var(--text-light);
    font-weight: 300; font-style: italic; margin-bottom: 20px;
  }
  .date-display {
    display: inline-block; padding: 8px 20px;
    background: linear-gradient(135deg, var(--pink-medium), var(--lavender));
    border-radius: 20px; color: white;
    font-size: 0.95rem; letter-spacing: 1px; font-weight: 500;
  }
  .controls {
    display: flex; gap: 15px; justify-content: center;
    flex-wrap: wrap; margin-bottom: 40px;
  }
  .btn {
    padding: 14px 32px; border: none; border-radius: 30px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem; font-weight: 500;
    cursor: pointer; transition: all 0.3s ease;
    letter-spacing: 0.5px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #f8c8d8, #e8b4c8);
    color: white;
    box-shadow: 0 4px 15px rgba(248, 200, 216, 0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(248, 200, 216, 0.6);
  }
  .btn-primary:disabled {
    opacity: 0.6; cursor: not-allowed; transform: none;
  }
  #fileInput { display: none; }
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 25px; margin-bottom: 60px;
  }
  .photo-card {
    background: white; border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(212, 165, 181, 0.2);
    transition: all 0.4s ease;
    animation: fadeIn 0.6s ease;
    position: relative;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .photo-card:hover {
    transform: translateY(-8px) rotate(-0.5deg);
    box-shadow: 0 15px 40px rgba(212, 165, 181, 0.35);
  }
  .photo-wrapper {
    position: relative; overflow: hidden;
    cursor: pointer; aspect-ratio: 1;
  }
  .photo-wrapper img {
    width: 100%; height: 100%;
    object-fit: cover; transition: transform 0.5s ease;
  }
  .photo-card:hover .photo-wrapper img { transform: scale(1.05); }
  .photo-overlay {
    position: absolute; top: 10px; right: 10px;
    display: flex; gap: 8px;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .photo-card:hover .photo-overlay { opacity: 1; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .icon-btn:hover { transform: scale(1.1); }
  .icon-btn.delete:hover { background: #ffd4dc; }
  .photo-caption {
    padding: 18px 20px; text-align: center;
    border-top: 1px solid rgba(248, 200, 216, 0.3);
  }
  .photo-caption p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem; color: var(--text-dark);
    font-style: italic; outline: none; min-height: 25px;
  }
  .photo-caption p[contenteditable="true"]:empty::before {
    content: 'Напиши что-нибудь нежное...';
    color: #c8b8c0;
  }
  .empty-state {
    text-align: center; padding: 80px 20px;
    color: var(--text-light);
  }
  .empty-state .emoji {
    font-size: 4rem; margin-bottom: 20px; display: block;
  }
  .empty-state h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 400;
    margin-bottom: 10px; color: var(--text-dark);
  }
  .modal {
    display: none; position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(90, 74, 82, 0.85);
    backdrop-filter: blur(10px);
    z-index: 100; justify-content: center; align-items: center;
    padding: 20px; animation: fadeIn 0.3s ease;
  }
  .modal.active { display: flex; }
  .modal-content { max-width: 90%; max-height: 90%; position: relative; }
  .modal-content img {
    max-width: 100%; max-height: 85vh;
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-close {
    position: absolute; top: -15px; right: -15px;
    width: 40px; height: 40px; border-radius: 50%;
    background: white; border: none; cursor: pointer;
    font-size: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: transform 0.2s ease;
  }
  .modal-close:hover { transform: scale(1.1) rotate(90deg); }
  footer {
    text-align: center; padding: 30px 20px;
    color: var(--text-light);
    font-size: 0.9rem; font-style: italic;
  }
  footer span {
    color: #e88ca5;
    animation: heartbeat 1.5s ease infinite;
    display: inline-block;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
  .notification {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: white; padding: 15px 25px;
    border-radius: 30px;
    box-shadow: 0 8px 25px rgba(212, 165, 181, 0.3);
    color: var(--text-dark);
    transition: transform 0.4s ease;
    z-index: 200;
  }
  .notification.show { transform: translateX(-50%) translateY(0); }
  .loading {
    text-align: center; padding: 40px;
    color: var(--text-light); font-style: italic;
  }
  .spinner {
    display: inline-block; width: 30px; height: 30px;
    border: 3px solid var(--pink-soft);
    border-top-color: var(--rose);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 15px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) {
    .gallery { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
    .photo-caption p { font-size: 1rem; }
    h1 { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<div class="container">
  <header>
    <h1>Для моей любимой 💗</h1>
    <p class="subtitle">Каждое фото — это наша маленькая история</p>
    <div class="date-display">Навсегда вместе 💕</div>
  </header>

  <div class="controls">
    <button class="btn btn-primary" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
      ✨ Добавить фото
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Загружаю нашу историю...</p>
  </div>

  <div class="gallery" id="gallery"></div>

  <div class="empty-state" id="emptyState" style="display:none;">
    <span class="emoji">🌸</span>
    <h2>Здесь пока пусто...</h2>
    <p>Добавь первое фото, чтобы начать нашу историю</p>
  </div>
</div>

<footer>
  Сделано с <span>♥</span> только для тебя
</footer>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <img id="modalImg" src="" alt="">
  </div>
</div>

<div class="notification" id="notification"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
  // ============================================
  // 🔑 Твои ключи Firebase
  // ============================================
  const firebaseConfig = {
    apiKey: "AIzaSyBo_z8csO2RsEeXOG-bnNSSOPJzxOw8-2E",
    authDomain: "dashylka-d39a7.firebaseapp.com",
    databaseURL: "https://dashylka-d39a7-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "dashylka-d39a7",
    storageBucket: "dashylka-d39a7.firebasestorage.app",
    messagingSenderId: "348265562354",
    appId: "1:348265562354:web:b9f89e5b9dbf533617906b"
  };
  // ============================================

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const photosRef = db.ref('photos');

  const gallery = document.getElementById('gallery');
  const fileInput = document.getElementById('fileInput');
  const emptyState = document.getElementById('emptyState');
  const loading = document.getElementById('loading');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');
  const uploadBtn = document.getElementById('uploadBtn');

  // Сердечки на фоне
  (function createHearts() {
    const bg = document.getElementById('heartsBg');
    const hearts = ['💗','💕','💖','🌸','✿','❀'];
    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (Math.random() * 15 + 15) + 's';
      heart.style.animationDelay = Math.random() * 20 + 's';
      heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
      bg.appendChild(heart);
    }
  })();

  // Сжатие изображения для быстрой загрузки
  function compressImage(dataUrl, callback) {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxSize = 1000;
      let width = img.width, height = img.height;
      if (width > height && width > maxSize) {
        height = (height * maxSize) / width; width = maxSize;
      } else if (height > maxSize) {
        width = (width * maxSize) / height; height = maxSize;
      }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = dataUrl;
  }

  // Загрузка фото в общую базу
  fileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    uploadBtn.disabled = true;
    uploadBtn.innerHTML = '⏳ Загружаю...';

    let loaded = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (event) => {
        compressImage(event.target.result, (compressed) => {
          const newRef = photosRef.push();
          newRef.set({
            src: compressed,
            caption: '',
            timestamp: Date.now()
          }).then(() => {
            loaded++;
            if (loaded === files.length) {
              uploadBtn.disabled = false;
              uploadBtn.innerHTML = '✨ Добавить фото';
              showNotification('✨ Фото добавлено в нашу историю');
            }
          });
        });
      };
      reader.readAsDataURL(file);
    });
    fileInput.value = '';
  });

  // Слушаем изменения в базе в реальном времени (общая галерея!)
  photosRef.on('value', (snapshot) => {
    loading.style.display = 'none';
    const data = snapshot.val() || {};
    const photos = Object.entries(data)
      .map(([id, photo]) => ({ id, ...photo }))
      .sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    renderGallery(photos);
  });

  function renderGallery(photos) {
    gallery.innerHTML = '';
    emptyState.style.display = photos.length === 0 ? 'block' : 'none';

    photos.forEach(photo => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.innerHTML = `
        <div class="photo-wrapper" onclick="openModal('${photo.src}')">
          <img src="${photo.src}" alt="" loading="lazy">
          <div class="photo-overlay">
            <button class="icon-btn delete" onclick="event.stopPropagation(); deletePhoto('${photo.id}')" title="Удалить">🗑️</button>
          </div>
        </div>
        <div class="photo-caption">
          <p contenteditable="true" data-id="${photo.id}">${photo.caption || ''}</p>
        </div>
      `;
      gallery.appendChild(card);
    });

    // Сохранение подписей в базу при редактировании
    document.querySelectorAll('.photo-caption p').forEach(p => {
      p.addEventListener('blur', () => {
        const id = p.dataset.id;
        photosRef.child(id).update({ caption: p.textContent });
      });
    });
  }

  function deletePhoto(id) {
    if (confirm('Удалить это фото из нашей истории?')) {
      photosRef.child(id).remove();
      showNotification('Фото удалено');
    }
  }

  function openModal(src) {
    modalImg.src = src;
    modal.classList.add('active');
  }

  function closeModal(e) {
    if (!e || e.target === modal || e.target.classList.contains('modal-close')) {
      modal.classList.remove('active');
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  function showNotification(text) {
    const n = document.getElementById('notification');
    n.textContent = text;
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 2500);
  }
</script>

</body>
</html>
